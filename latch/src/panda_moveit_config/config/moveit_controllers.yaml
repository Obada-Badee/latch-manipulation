# MoveIt uses this configuration for controller management
trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  # Kept in step with gripper_moveit_controllers.yaml, which is the file the
  # launch actually passes to MoveItConfigsBuilder.trajectory_execution().
  # See the rationale there: 0.01 rad is tighter than the simulated arm
  # holds still across a 1.5 s plan at real-time factor 0.5.
  allowed_start_tolerance: 0.05
  trajectory_duration_monitoring: true

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - panda_arm_controller

  panda_arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
